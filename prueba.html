<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formulario de Admisión</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.form-container{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    width:350px;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:10px;
}

input, select{
    width:100%;
    padding:8px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    margin-top:20px;
    width:100%;
    padding:10px;
    background:#007BFF;
    border:none;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

</style>

</head>

<body>

<div class="form-container">

<h2>Registro de Estudiante</h2>

<form action="http://localhost:3000/admisiones" method="POST">

<label>Nombres</label>
<input type="text" name="nombres" required>

<label>Apellidos</label>
<input type="text" name="apellidos" required>

<label>Edad</label>
<input type="number" name="edad" min="0" max="120">

<label>Sexo</label>
<select name="sexo_id">
<option value="">Seleccionar</option>
<option value="1">Masculino</option>
<option value="2">Femenino</option>
</select>

<button type="submit">Guardar</button>

</form>

</div>

</body>
</html>
